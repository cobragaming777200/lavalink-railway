server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # Increased slightly for more playback stability
    bufferDurationMs: 1000
    frameBufferDurationMs: 10000

    opusEncodingQuality: 10
    resamplingQuality: HIGH

    trackStuckThresholdMs: 60000
    useSeekGhosting: true
    playerUpdateInterval: 5

    timeouts:
      connectTimeoutMs: 15000
      connectionRequestTimeoutMs: 15000
      socketTimeoutMs: 30000


plugins:
  youtube:
    enabled: true

    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - MWEB
      - WEB

    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"

    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      password: ""
      userAgent: "ZENTRA-Lavalink"


  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

    sources:
      spotify: true
      applemusic: false
      deezer: false

    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "IN"

      playlistLoadLimit: 6
      albumLoadLimit: 6

      resolveArtistsInSearch: true
      localFiles: false

      preferPartnerApi: true
      preferV1SearchApi: false

      customTokenEndpoint: "https://spotify-tokener-production-072b.up.railway.app/api/token"


logging:
  level:
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO