server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # Playback buffering
    bufferDurationMs: 400
    frameBufferDurationMs: 5000

    # Keep Railway CPU usage lower
    opusEncodingQuality: 5
    resamplingQuality: LOW

    # Don't mark a track as stuck too quickly
    trackStuckThresholdMs: 45000

    useSeekGhosting: true
    playerUpdateInterval: 5

    timeouts:
      connectTimeoutMs: 15000
      connectionRequestTimeoutMs: 15000
      socketTimeoutMs: 20000

plugins:

  # ==================================================
  # YOUTUBE
  # ==================================================
  youtube:
    enabled: true

    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # Order matters.
    # MUSIC = YouTube Music search
    # TV = OAuth playback
    # ANDROID_VR / WEB / WEBEMBEDDED = playback fallbacks
    clients:
      - MUSIC
      - TV
      - ANDROID_VR
      - WEB
      - WEBEMBEDDED

    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
      skipInitialization: true

    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      password: ""
      userAgent: "ZENTRA-Lavalink"


  # ==================================================
  # LAVASRC / SPOTIFY
  # ==================================================
  lavasrc:

    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

    sources:
      spotify: true
      applemusic: false
      deezer: false

    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"

      countryCode: "IN"

      playlistLoadLimit: 6
      albumLoadLimit: 6

      resolveArtistsInSearch: true
      localFiles: false

      preferPartnerApi: true
      preferV1SearchApi: false

      customTokenEndpoint: "https://spotify-tokener-production-072b.up.railway.app/api/token"


# ==================================================
# LOGGING
# ==================================================
logging:
  level:
    root: INFO
    lavalink: INFO
    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO