server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    sources:
      youtube: false
      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    bufferDurationMs: 400
    frameBufferDurationMs: 5000
    opusEncodingQuality: 10
    resamplingQuality: HIGH

    # Avoid treating a short network interruption as a stuck song.
    trackStuckThresholdMs: 45000

    useSeekGhosting: true
    playerUpdateInterval: 5

    timeouts:
      connectTimeoutMs: 15000
      connectionRequestTimeoutMs: 15000
      socketTimeoutMs: 20000

plugins:
  youtube:
    enabled: true
    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # MUSIC handles YouTube Music search metadata.
    # TV is placed before the unsigned playback clients so OAuth is tried first.
    # The failing ANDROID_VR and WEBEMBEDDED clients were removed.
    clients:
      - MUSIC
      - TV
      - TVHTML5_SIMPLY
      - MWEB
      - WEB

    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"

    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      password: ""
      userAgent: "ZENTRA-Lavalink"

  lavasrc:
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

    sources:
      spotify: true
      applemusic: false
      deezer: false

    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"
      countryCode: "IN"

      # 6 pages x 100 tracks = up to 600 tracks from a Spotify playlist.
      playlistLoadLimit: 6
      albumLoadLimit: 6
      resolveArtistsInSearch: true

      # Public Spotify playlist support through the Web API.
      localFiles: false
      preferPartnerApi: false
      preferV1SearchApi: false

logging:
  level:
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO