server:
  port: ${PORT:2333}
  address: 0.0.0.0

lavalink:
  plugins:
    # YouTube Source
    - dependency: "dev.lavalink.youtube:youtube-plugin:1.18.2"
      snapshot: false

    # Spotify / LavaSrc
    - dependency: "com.github.topi314.lavasrc:lavasrc-plugin:4.8.3"
      repository: "https://maven.lavalink.dev/releases"
      snapshot: false

  server:
    password: "${LAVALINK_PASSWORD:youshallnotpass}"

    # ==================================================
    # SOURCES
    # ==================================================
    sources:
      # IMPORTANT:
      # Disable Lavalink built-in YouTube.
      # youtube-plugin handles YouTube instead.
      youtube: false

      bandcamp: true
      soundcloud: true
      twitch: true
      vimeo: true
      http: true
      local: false

    # ==================================================
    # FILTERS
    # ==================================================
    filters:
      volume: true
      equalizer: true
      karaoke: true
      timescale: true
      tremolo: true
      vibrato: true
      distortion: true
      rotation: true
      channelMix: true
      lowPass: true

    # ==================================================
    # PLAYBACK
    # ==================================================

    # Audio buffering
    bufferDurationMs: 400
    frameBufferDurationMs: 5000

    # Lower Railway CPU / memory usage
    opusEncodingQuality: 5
    resamplingQuality: LOW

    # Give a track enough time before declaring it stuck
    trackStuckThresholdMs: 45000

    useSeekGhosting: true

    # Player update interval in seconds
    playerUpdateInterval: 5

    # ==================================================
    # NETWORK TIMEOUTS
    # ==================================================
    timeouts:
      connectTimeoutMs: 15000
      connectionRequestTimeoutMs: 15000
      socketTimeoutMs: 20000


# ==================================================
# PLUGINS
# ==================================================
plugins:

  # ==================================================
  # YOUTUBE
  # ==================================================
  youtube:
    enabled: true

    allowSearch: true
    allowDirectVideoIds: true
    allowDirectPlaylistIds: true

    # ------------------------------------------------
    # YOUTUBE CLIENTS
    # ------------------------------------------------
    #
    # MUSIC:
    # Used mainly for YouTube Music/search.
    #
    # TV:
    # OAuth-compatible playback client.
    #
    # Keeping this list small prevents Lavalink from
    # falling through multiple blocked Railway clients.
    #
    clients:
      - MUSIC
      - TV

    # ------------------------------------------------
    # YOUTUBE OAUTH
    # ------------------------------------------------
    oauth:
      enabled: true
      refreshToken: "${YOUTUBE_REFRESH_TOKEN}"
      skipInitialization: true

    # ------------------------------------------------
    # REMOTE CIPHER
    # ------------------------------------------------
    remoteCipher:
      url: "https://cipher.kikkia.dev/"
      password: ""
      userAgent: "ZENTRA-Lavalink"


  # ==================================================
  # LAVASRC
  # ==================================================
  lavasrc:

    # When Spotify returns track metadata,
    # LavaSrc tries these providers for actual audio.
    providers:
      - "ytsearch:\"%ISRC%\""
      - "ytmsearch:%QUERY%"
      - "ytsearch:%QUERY%"
      - "scsearch:%QUERY%"

    sources:
      spotify: true
      applemusic: false
      deezer: false

    # ==================================================
    # SPOTIFY
    # ==================================================
    spotify:
      clientId: "${SPOTIFY_CLIENT_ID}"
      clientSecret: "${SPOTIFY_CLIENT_SECRET}"

      countryCode: "IN"

      playlistLoadLimit: 6
      albumLoadLimit: 6

      resolveArtistsInSearch: true
      localFiles: false

      preferPartnerApi: true
      preferV1SearchApi: false

      customTokenEndpoint: "https://spotify-tokener-production-072b.up.railway.app/api/token"


# ==================================================
# LOGGING
# ==================================================
logging:
  level:
    root: INFO
    lavalink: INFO

    dev.lavalink.youtube: INFO
    dev.lavalink.youtube.http.YoutubeOauth2Handler: INFO